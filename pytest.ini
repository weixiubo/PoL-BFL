[pytest]
addopts = -q
filterwarnings =
    ignore:.*abi.decode_abi\(\) is deprecated.*:DeprecationWarning
    ignore:.*abi.decode_single\(\) is deprecated.*:DeprecationWarning
testpaths =
    tests

markers =
    timeout: mark test with a timeout (provided by pytest-timeout or custom handling)
    order: mark test execution order hint
